<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมุดขายไอดีเกม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ร้านของฉัน">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="store.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{margin:0}
/* Layout: clean white & blue — one column: input card, filters, KPI tiles, chart, lists, ledger */
:root{
  color-scheme:light;
  --bg:#f4f8fe; --surface:#ffffff; --ink:#0f1f3d; --muted:#5b6b86; --line:#e3eaf5; --line-strong:#cdd9ec;
  --blue:#2563eb; --blue-hover:#1d4fd8; --blue-soft:#e8f0fe; --blue-ink:#1e40af;
  --income:#2563eb; --transfer:#0ea5c6; --expense:#e5484d; --owe:#d97706;
  --shadow:0 1px 2px rgba(15,31,61,.04),0 4px 14px rgba(37,99,235,.06);
  --display:"Bai Jamjuree","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --r:12px;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:1.65rem;font-weight:700;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:12px;height:28px;border-radius:4px;background:var(--blue)}
h2{font-size:1.05rem;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}

/* form controls */
.field,textarea,input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
textarea{width:100%;box-sizing:border-box;min-height:120px;padding:12px 14px;resize:vertical}
.field:hover,textarea:hover,input[type=date]:hover{border-color:#a9bde0}
.field:focus,textarea:focus,input[type=date]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea::placeholder{color:#97a6bf}
.field.num{width:84px;text-align:right}
.field.qty{width:62px;text-align:right}
.field.text{width:100%;min-width:120px;box-sizing:border-box}

/* buttons */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;font-size:.92rem;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .05s;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--blue-soft);border-color:#b9cdf3;color:var(--blue-ink)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--blue-soft),0 0 0 4px var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.25)}
button.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--blue-soft);color:var(--blue-ink)}
button.danger:hover{background:#fdecec;border-color:#f5bcbd;color:var(--expense)}
button:disabled{opacity:.5;cursor:default;transform:none}
button.small{padding:4px 10px;font-size:.82rem;font-weight:500;border-radius:8px}
.hint{color:var(--muted);font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);border:1px solid transparent;font-weight:500}
.chip:hover{border-color:#b9cdf3;background:var(--blue-soft)}
.chip::before{content:"+";font-weight:700}

/* badges */
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-cash{background:#e8f0fe;color:#1e40af}
.t-transfer{background:#e0f6fb;color:#0b7a93}
.t-expense{background:#fdecec;color:#c22f34}
.t-staff,.t-debt{background:#fef3e2;color:#a85a05}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.profit{background:linear-gradient(135deg,#2563eb,#3b82f6);border-color:#2563eb}
.kpi.profit .l{color:#dbe7ff}.kpi.profit .v{color:#fff}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* segmented control */
.seg{display:inline-flex;background:#e9effa;border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;box-shadow:none;border-radius:9px;font-weight:500;padding:6px 14px;color:var(--muted)}
.seg button:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blue-ink);font-weight:700;box-shadow:0 1px 3px rgba(15,31,61,.12)}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:#f7faff}
tbody tr:hover td{background:#f9fbff}
td.num,th.num{text-align:right;white-space:nowrap}
.preview td{padding:6px}
.status{font-size:.88rem;color:var(--muted)}
.status.err{color:var(--expense)}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.split{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums;padding:8px 0;border-bottom:1px solid var(--line)}
.list div:last-child{border-bottom:none}
.list span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* illustrated icons */
.ico{display:inline-flex;width:30px;height:30px;flex:none;background:#fff;border:1px solid var(--line);border-radius:9px;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,31,61,.06)}
.ico svg{width:22px;height:22px}
h2[data-icon],.btn-ico[data-icon]{display:flex;align-items:center;gap:10px}
button[data-icon] .ico{width:22px;height:22px;border:none;box-shadow:none;background:transparent}
button[data-icon] .ico svg{width:20px;height:20px}
.banner{background:linear-gradient(135deg,#1d4fd8,#3b82f6);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px;color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.25)}
.banner .logo{width:58px;height:58px;flex:none;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.banner .logo svg{width:44px;height:44px}
.banner h1{color:#fff}.banner h1::before{display:none}
.banner .sub{color:#dbe7ff}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{flex-direction:column;justify-content:center;gap:6px;padding:12px 6px 10px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,31,61,.07)}
.tile:hover{background:#fff;border-color:#b9cdf3;box-shadow:0 4px 14px rgba(37,99,235,.15);transform:translateY(-1px)}
.tile-ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:#f4f8fe;border-radius:12px}
.tile-ico svg{width:42px;height:42px}
.tile-l{color:var(--blue-ink);font-size:.82rem;font-weight:600;text-align:center;line-height:1.3}
@media (max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.kpi{display:flex;gap:10px;align-items:center}
.kpi .ki{width:42px;height:42px;flex:none;border-radius:11px;background:#f4f8fe;display:flex;align-items:center;justify-content:center}
.kpi .ki svg{width:32px;height:32px}
.kpi .kt{min-width:0}
.kpi.profit .ki{background:#fff}
@media (max-width:400px){.kpi .ki{width:34px;height:34px}.kpi .ki svg{width:26px;height:26px}.kpi .v{font-size:1.15rem}}

/* ledger */
.lg-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg .cnt{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:rgba(37,99,235,.1);font-size:.72rem;font-weight:700;margin-left:2px}
.lg-search{flex:1 1 200px;max-width:320px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:10px;padding:0 10px;background:#fff;color:var(--muted);transition:border-color .15s,box-shadow .15s}
.lg-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.lg-search svg{width:16px;height:16px;flex:none}
.lg-search input{border:none;outline:none;font:inherit;padding:8px 0;width:100%;background:transparent;color:var(--ink)}
.ledger{display:flex;flex-direction:column;gap:12px}
.day{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;transition:box-shadow .2s}
.day[open]{box-shadow:0 2px 10px rgba(15,31,61,.05)}
.day summary{list-style:none;cursor:pointer;padding:12px 14px 0;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#f7faff,#fff)}
.day summary::-webkit-details-marker{display:none}
.day summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.day-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-d{font-family:var(--display);font-weight:700;font-size:1rem}
.day-tag{font-size:.72rem;font-weight:700;color:#fff;background:var(--blue);padding:1px 8px;border-radius:999px}
.day-n{font-size:.8rem;color:var(--muted)}
.day-s{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.day-s span{padding:3px 9px;border-radius:8px}
.day-s .in{background:#e8f0fe;color:#1e40af}.day-s .out{background:#fdecec;color:#c22f34}
.day-s .pr{background:var(--blue);color:#fff}.day-s .pr.neg{background:#c22f34}
.chev{width:18px;height:18px;margin-left:auto;color:var(--muted);transition:transform .2s}
.day:not([open]) .chev{transform:rotate(-90deg)}
.day-bar{height:4px;background:#fdecec;border-radius:2px;margin:0 -14px;overflow:hidden}
.day-bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:0 2px 2px 0;transition:width .5s}
.rows{list-style:none;margin:0;padding:4px 6px 6px}
.r{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;transition:background .15s,transform .15s,opacity .2s}
.r+.r{border-top:1px solid var(--line)}
.r:hover{background:#f7faff}
.r:hover+.r,.r:hover{border-color:transparent}
.r-ico{width:40px;height:40px;border-radius:11px;background:#f4f8fe;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.r:hover .r-ico{transform:scale(1.08) rotate(-4deg)}
.r-ico svg{width:30px;height:30px}
.r-main{display:flex;flex-direction:column;min-width:0;gap:3px}
.r-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.r-meta .ex{border:1px dashed var(--line-strong);border-radius:6px;padding:0 6px}
.r-meta .due{color:#a85a05;font-weight:600}
.r-meta .paid{color:#15803d;font-weight:600;display:inline-flex;align-items:center;gap:2px}
.r-meta .paid svg{width:13px;height:13px}
.r-amt{font-family:var(--display);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.a-cash{color:#1e40af}.a-transfer{color:#0b7a93}.a-expense{color:#c22f34}.a-debt,.a-staff{color:#a85a05}
.r.done .r-amt{text-decoration:line-through;opacity:.55}
.r-act{display:flex;gap:4px;align-items:center}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:#94a3b8;border-radius:9px}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:#fdecec;color:var(--expense);border-color:transparent}
.icon-btn.armed{width:auto;padding:0 10px;background:var(--expense);color:#fff;font-size:.8rem;gap:4px;animation:shake .3s}
.icon-btn.armed:hover{background:#c22f34;color:#fff}
.pay{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}
.pay:hover{background:#dcfce7;border-color:#86efac;color:#15803d}
.pay svg{width:14px;height:14px}
.r.new{animation:rowIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.r.new .r-ico{animation:pop .5s .1s both}
.r.leaving{opacity:0;transform:translateX(24px)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px);background:#e8f0fe}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.lg-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 10px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:14px}
.lg-empty-ico{width:60px;height:60px;border-radius:16px;background:#f4f8fe;display:flex;align-items:center;justify-content:center}
.lg-empty-ico svg{width:44px;height:44px}
@media (max-width:560px){
  .r{gap:8px;padding:10px 4px}
  .r-ico{width:36px;height:36px}.r-ico svg{width:26px;height:26px}
  .pay span{display:none}.pay{padding:4px 7px}
  .lg-search{max-width:none}
}
@media (prefers-reduced-motion:reduce){.r.new,.r.new .r-ico,.icon-btn.armed{animation:none}}
.back{display:inline-block;color:#dbe7ff;text-decoration:none;font-size:.85rem;font-weight:600;margin-bottom:2px}
.back:hover{color:#fff;text-decoration:underline}
</style>
<style>
.tiles{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.kpi.net{background:linear-gradient(135deg,#2563eb,#3b82f6);border-color:#2563eb}
.kpi.net .l{color:#dbe7ff}.kpi.net .v{color:#fff}.kpi.net .ki{background:#fff}
.t-buy{background:#eef2ff;color:#4338ca}.t-sell{background:#e8f0fe;color:#1e40af}.t-pagefee{background:#f3e8ff;color:#7e22ce}.t-expense{background:#fdecec;color:#c22f34}
.a-buy{color:#4338ca}.a-sell{color:#1e40af}.a-pagefee{color:#7e22ce}.a-expense{color:#c22f34}
.pv{display:flex;flex-direction:column;gap:10px}
.pv-item{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;background:#fbfdff}
.pv-item label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted);min-width:0}
.pv-item .field{width:100%;box-sizing:border-box;min-width:0}
.pv-item .del{justify-self:end}
.profit-tag{font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#ecfdf3;color:#15803d}
.profit-tag.neg{background:#fdecec;color:#c22f34}
.stock-row{display:flex;flex-direction:column;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.stock-row:last-child{border-bottom:none}
.stock-top{display:flex;align-items:center;gap:10px}
.stock-top .r-ico{width:36px;height:36px}.stock-top .r-ico svg{width:26px;height:26px}
.stock-top .r-main{flex:1}
.sellform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;background:#f4f8fe;border-radius:10px;padding:8px}
.sellform .field{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:520px){.sellform{grid-template-columns:1fr 1fr}}
.age{font-size:.74rem;color:var(--muted)}
.age.old{color:#a85a05;font-weight:600}
/* photos */
.thumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;padding:0;border:1px solid var(--line);background:#f4f8fe;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.thumb:hover img{transform:scale(1.08)}
.thumb .more{position:absolute;inset:0;background:rgba(15,31,61,.55);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.add-photo{width:56px;height:56px;border-radius:10px;border:1.5px dashed #a9bde0;background:#f7faff;color:var(--blue);flex-direction:column;justify-content:center;gap:0;padding:0;font-size:.68rem;font-weight:600}
.add-photo svg{width:20px;height:20px}
.add-photo:hover{border-style:solid}
.add-photo.busy{pointer-events:none;opacity:.7}
.add-photo.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pv-item .thumbs{grid-column:1/-1}
.r-ico.photo{padding:0;overflow:hidden;cursor:zoom-in;border:1px solid var(--line)}
.r-ico.photo img{width:100%;height:100%;object-fit:cover}
.r-ico.photo:hover{transform:scale(1.06)}
.stock-row .thumbs{padding-left:46px}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadeIn .2s}
.viewer img{max-width:100%;max-height:calc(100% - 110px);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4);object-fit:contain;animation:zoomIn .25s}
.viewer .vbar{display:flex;gap:8px;align-items:center;color:#dbe7ff;flex-wrap:wrap;justify-content:center}
.viewer .vtitle{color:#fff;font-weight:600;text-align:center}
.viewer button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.viewer button:hover{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.35)}
.viewer button.vdel.armed{background:var(--expense);border-color:var(--expense)}
@keyframes fadeIn{from{opacity:0}}@keyframes zoomIn{from{transform:scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){.viewer,.viewer img,.add-photo.busy svg{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="logo" id="logo"></div>
    <div><a class="back" href="./">‹ เมนูหลัก</a><h1>สมุดขายไอดีเกม</h1>
    <p class="sub">บันทึกรับซื้อ-ขายไอดี ค่ายศเพจ ดูกำไรต่อไอดีและสต็อกคงเหลือ ส่งออก Excel / Google Sheet ได้</p></div>
  </header>

  <section class="card" aria-labelledby="inH">

function ruleParse(text){
  const out=[];

    line=line.trim(); if(!line) continue;
    const nums=[...line.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(บาท|฿)?/g)].map(m=>({v:parseFloat(m[1].replace(/,/g,"")),baht:!!m[2]}));

    const amt=(nums.find(n=>n.baht)||nums[nums.length-1]).v;
    let type="sell";
    if(/ยศ.*เพจ|เพจ.*ยศ|ค่าเพจ/.test(line)) type="pagefee";
    else if(/รับซื้อ|^ซื้อ|รับมา|ได้มา/.test(line)) type="buy";
    else if(/ขาย|ปล่อย/.test(line)) type="sell";
    else if(/จ่าย|^ค่า/.test(line)) type="expense";
    const person=((line.match(/(?:จาก|ให้|คนซื้อ|ลูกค้า)\s*([^\s\d]+)/)||[])[1]||"");
    const method=/โอน|พร้อมเพย์|สแกน|ทรู|wallet/i.test(line)?"transfer":"cash";
    const game=guessGame(line);
    const ms=[...line.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(บาท|฿)?/g)]; const am=ms.find(m=>m[2])||ms[ms.length-1];
    let detail=(line.slice(0,am.index)+" "+line.slice(am.index+am[0].length)).replace(/รับซื้อ|ซื้อ|ขาย|ปล่อย|ราคา|โอน|เงินสด|สด|จาก\s*\S*|ให้\s*\S*|จ่าย|ค่ายศเพจ/g," ");
    for(const [,re] of GAMES) detail=detail.replace(re," ");
    detail=detail.replace(/ไอดี|id/gi," ").replace(/\s+/g," ").trim();
    const p={type,game,detail,amount:amt,cost:0,person,method,stockId:""};
    if(type==="pagefee"){p.detail=detail||"ค่ายศเพจ";p.game="";}
    if(type==="expense"){p.detail=detail||"รายจ่าย";p.game="";}
    if(type==="sell") p.stockId=matchStock(p);
    out.push(p);
  }
  return out;
}
function matchStock(p){
  const s=unsold(); if(!s.length) return "";
  const g=s.filter(x=>!p.game||x.game===p.game);
  if(!g.length) return "";
  const words=(p.detail||"").split(/\s+/).filter(w=>w.length>1);
  const scored=g.map(x=>({x,sc:words.filter(w=>(x.detail||"").includes(w)).length})).sort((a,b)=>b.sc-a.sc);
  return scored[0].x.id;
}

สต็อกที่ยังไม่ขาย: ${JSON.stringify(stock)}
ข้อความ:
${text}`;

}

function compress(file){return new Promise(res=>{
  if(!/^image\//.test(file.type)||file.type==="image/gif"){res(file);return;}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b&&b.size<file.size?b:file),"image/jpeg",0.85)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url;})}

    ${sellingId===x.id?`<div class="sellform"><input class="field" type="number" inputmode="decimal" id="sfPrice" placeholder="ราคาขาย" aria-label="ราคาขาย"><select class="field" id="sfMethod" aria-label="วิธีรับเงิน"><option value="transfer">โอน</option><option value="cash">เงินสด</option></select><input class="field" id="sfBuyer" placeholder="คนซื้อ" aria-label="คนซื้อ"><div class="row" style="gap:4px"><button class="small primary" id="sfOk">บันทึก</button><button class="small ghost" id="sfNo">ยกเลิก</button></div><span class="hint" id="sfProfit" style="grid-column:1/-1">ใส่ราคาขายเพื่อดูกำไร</span></div>`:""}
  </div>`}).join("");
  wirePhotos(box);
  box.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{sellingId=b.dataset.sell;render();setTimeout(()=>$("sfPrice")?.focus(),30)});
  if(sellingId&&$("sfPrice")){
    const x=ids.find(i=>i.id===sellingId);
    $("sfPrice").oninput=e=>{const pr=(+e.target.value||0)-x.cost;$("sfProfit").innerHTML=`<span class="profit-tag ${pr<0?"neg":""}">กำไร ฿${fmt(pr)}</span>`};
    $("sfNo").onclick=()=>{sellingId=null;render()};
    $("sfOk").onclick=async()=>{const price=+$("sfPrice").value;if(!price){$("sfProfit").textContent="ใส่ราคาขายก่อน";return;}
      $("sfOk").disabled=true;
      try{await col.doc(x.id).update({status:"sold",price,saleDate:today(),buyer:$("sfBuyer").value.trim(),method:$("sfMethod").value,soldAt:Date.now()});sellingId=null;}
      catch(e){$("sfProfit").textContent="บันทึกไม่สำเร็จ ลองอีกครั้ง";$("sfOk").disabled=false;}};
  }
}

/* ---------- ledger ---------- */
const LG_FILTERS=[["all","ทั้งหมด"],["sell","ขาย"],["buy","รับซื้อ"],["cost","ค่ายศ/จ่าย"]];
let lgFilter="all", lgQuery="", seenIds=null; const closedDays=new Set();
$("lgSearch").oninput=e=>{lgQuery=e.target.value.trim().toLowerCase();render()};
function dayLabel(d){const t=today(),y=new Date();y.setDate(y.getDate()-1);
  return {long:new Date(d+"T00:00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short",year:"2-digit"}),tag:d===t?"วันนี้":d===ymd(y)?"เมื่อวาน":""};}
function renderLedger(sold,bought,cs){
  const ev=[...sold.map(x=>({key:"s"+x.id,ref:x.id,kind:"sell",date:x.saleDate,t:x.soldAt||x.createdAt,x})),
            ...bought.map(x=>({key:"b"+x.id,ref:x.id,kind:"buy",date:x.buyDate,t:x.createdAt,x})),
            ...cs.map(c=>({key:"c"+c.id,ref:c.id,kind:c.kind,date:c.date,t:c.createdAt,c}))];
  const match=(e,f)=>f==="all"||(f==="sell"&&e.kind==="sell")||(f==="buy"&&e.kind==="buy")||(f==="cost"&&(e.kind==="pagefee"||e.kind==="expense"));
  $("lgFilter").innerHTML=LG_FILTERS.map(([k,l])=>`<button data-f="${k}" aria-pressed="${k===lgFilter}">${l} <span class="cnt">${ev.filter(e=>match(e,k)).length}</span></button>`).join("");
  $("lgFilter").querySelectorAll("button").forEach(b=>b.onclick=()=>{lgFilter=b.dataset.f;render()});
  const text=e=>e.x?[e.x.game,e.x.detail,e.x.buyer,e.x.seller].join(" ").toLowerCase():(e.c.item||"").toLowerCase();
  const rows=ev.filter(e=>match(e,lgFilter)&&(!lgQuery||text(e).includes(lgQuery))).sort((a,b)=>b.date.localeCompare(a.date)||b.t-a.t);
  const firstLoad=seenIds===null, known=seenIds||new Set();
  if(!rows.length) $("ledger").innerHTML=`<div class="lg-empty"><div class="lg-empty-ico">${ICONS.list}</div><b>${ev.length?"ไม่พบรายการที่ค้นหา":"ยังไม่มีรายการในช่วงนี้"}</b><span class="hint">${ev.length?"ลองเปลี่ยนตัวกรองหรือคำค้นหา":"แตะปุ่มด่วนด้านบนเพื่อบันทึกรายการแรก"}</span></div>`;
  else{
    const days={}; rows.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
    $("ledger").innerHTML=Object.entries(days).map(([d,items])=>{
      const all=ev.filter(e=>e.date===d);
      const inc=all.filter(e=>e.kind==="sell").reduce((a,e)=>a+e.x.price,0);
      const gp=all.filter(e=>e.kind==="sell").reduce((a,e)=>a+e.x.price-e.x.cost,0);
      const fee=all.filter(e=>e.c).reduce((a,e)=>a+e.c.amount,0);
      const buy=all.filter(e=>e.kind==="buy").reduce((a,e)=>a+e.x.cost,0);
      const pr=gp-fee; const pct=inc+fee+buy?Math.round(inc/(inc+fee+buy)*100):0;
      const {long,tag}=dayLabel(d);
      return `<details class="day" data-day="${d}"${closedDays.has(d)?"":" open"}><summary>
        <div class="day-h"><span class="day-d">${long}</span>${tag?`<span class="day-tag">${tag}</span>`:""}<span class="day-n">${items.length} รายการ</span></div>
        <div class="day-s"><span class="in">ขาย ฿${fmt(inc)}</span>${buy?`<span class="out" style="background:#eef2ff;color:#4338ca">รับซื้อ ฿${fmt(buy)}</span>`:""}${fee?`<span class="out">จ่าย ฿${fmt(fee)}</span>`:""}<span class="pr ${pr<0?"neg":""}">กำไร ฿${fmt(pr)}</span><svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="day-bar" aria-hidden="true"><i style="width:${pct}%"></i></div></summary>
        <ul class="rows">${items.map((e,i)=>{
          const isNew=!firstLoad&&!known.has(e.key); let name,meta,amt;
          if(e.x){const x=e.x;name=`${esc(x.game)}${x.detail?" · "+esc(x.detail):""}`;
            if(e.kind==="sell"){const p=x.price-x.cost;meta=`<span class="pill t-sell">ขายไอดี</span>${x.method?`<span>${METHOD[x.method]}</span>`:""}${x.buyer?`<span>ให้ ${esc(x.buyer)}</span>`:""}<span class="profit-tag ${p<0?"neg":""}">กำไร ฿${fmt(p)}</span>`;amt=`+฿${fmt(x.price)}`;}
            else{meta=`<span class="pill t-buy">รับซื้อไอดี</span>${x.seller?`<span>จาก ${esc(x.seller)}</span>`:""}<span>${x.status==="sold"?"ขายแล้ว":"อยู่ในสต็อก"}</span>`;amt=`−฿${fmt(x.cost)}`;}
            if(x.example) meta+='<span class="ex">ตัวอย่าง</span>';}
          else{name=esc(e.c.item);meta=`<span class="pill t-${e.kind}">${TYPES[e.kind]}</span>${e.c.example?'<span class="ex">ตัวอย่าง</span>':""}`;amt=`−฿${fmt(e.c.amount)}`;}
          const delAttr=e.kind==="sell"?`data-unsell="${e.ref}"`:e.kind==="buy"?`data-delid="${e.ref}"`:`data-delc="${e.ref}"`;
          const ph=e.x&&e.x.photos&&e.x.photos.length;
          const icoHtml=ph?`<button class="r-ico photo" data-view="${e.x.id}" data-idx="0" aria-label="ดูรูป ${e.x.photos.length} รูป"><img src="${blob(e.x.photos[0])}" alt="" loading="lazy"></button>`:`<span class="r-ico">${ICONS[e.kind==="sell"?"sell":e.kind]}</span>`;
          if(ph&&e.x.photos.length>1) meta+=`<span>📷 ${e.x.photos.length} รูป</span>`;
          return `<li class="r ${isNew?"new":""}" style="--i:${Math.min(i,8)}">${icoHtml}
            <span class="r-main"><span class="r-name">${name}</span><span class="r-meta">${meta}</span></span>
            <span class="r-amt a-${e.kind}">${amt}</span>
            <span class="r-act"><button class="icon-btn" ${delAttr} aria-label="${e.kind==="sell"?"ยกเลิกการขาย":"ลบ"}">${TRASH}</button></span></li>`}).join("")}</ul></details>`}).join("");
  }
  seenIds=new Set(ev.map(e=>e.key).concat([...known]));
  $("ledger").querySelectorAll("details.day").forEach(dt=>dt.addEventListener("toggle",()=>{dt.open?closedDays.delete(dt.dataset.day):closedDays.add(dt.dataset.day)}));
  $("ledger").querySelectorAll(".icon-btn").forEach(b=>b.onclick=()=>armed(b));
  wirePhotos($("ledger"));
}
function armed(b){
  if(!b.dataset.armed){const lbl=b.dataset.unsell?"ยกเลิกขาย":"ยืนยันลบ";b.dataset.armed="1";b.classList.add("armed");b.innerHTML=TRASH+`<span>${lbl}</span>`;
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.classList.remove("armed");b.innerHTML=TRASH}},3000);return;}
  b.closest(".r")?.classList.add("leaving");
  setTimeout(()=>{
    if(b.dataset.unsell) col.doc(b.dataset.unsell).update({status:"stock"}).catch(()=>{});
    else if(b.dataset.delid){const x=ids.find(i=>i.id===b.dataset.delid);col.doc(b.dataset.delid).delete().then(()=>((x&&x.photos)||[]).forEach(ph=>assetsApi&&assetsApi.delete(ph).catch(()=>{}))).catch(()=>{});}
    else costCol.doc(b.dataset.delc).delete().catch(()=>{});
  },220);
}
$("clearExamples").onclick=async()=>{for(const x of ids.filter(x=>x.example)){try{await col.doc(x.id).delete()}catch(_){}}for(const c of costs.filter(x=>x.example)){try{await costCol.doc(c.id).delete()}catch(_){}}};

function drawChart(){
  const days=[]; for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  const data=days.map(d=>{const s=ids.filter(x=>x.status==="sold"&&x.saleDate===d);return{d,s:s.reduce((a,x)=>a+x.price,0),p:s.reduce((a,x)=>a+x.price-x.cost,0),f:costs.filter(c=>c.date===d).reduce((a,c)=>a+c.amount,0)}});
  const max=Math.max(1,...data.map(v=>Math.max(v.s,v.f)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(m=>m*step).find(s=>max/s<=5)||step*10;
  const top=Math.ceil(max/nice)*nice;
  const W=640,H=220,L=48,B=28,T=10,cw=(W-L-8)/14,y=v=>T+(H-T-B)*(1-Math.max(0,v)/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="กราฟยอดขายและกำไรรายวัน">`;
  for(let v=0;v<=top+1e-9;v+=nice) s+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?fmt(v/1000)+"k":fmt(v)}</text>`;
  data.forEach((v,i)=>{const x=L+i*cw+cw*0.15,bw=cw*0.36;
    s+=`<rect x="${x}" y="${y(v.s)}" width="${bw}" height="${y(0)-y(v.s)}" fill="#93c5fd" rx="2"><title>${thDate(v.d)} ยอดขาย ฿${fmt(v.s)}</title></rect>`;
    s+=`<rect x="${x}" y="${y(v.p)}" width="${bw}" height="${y(0)-y(v.p)}" fill="#2563eb" rx="2"><title>${thDate(v.d)} กำไรต่อไอดี ฿${fmt(v.p)}</title></rect>`;
    s+=`<rect x="${x+bw+2}" y="${y(v.f)}" width="${bw*0.7}" height="${y(0)-y(v.f)}" fill="#a855f7" rx="2"><title>${thDate(v.d)} ค่ายศเพจ+จ่ายอื่น ฿${fmt(v.f)}</title></rect>`;
    if(i%2===1||i===13) s+=`<text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle">${thDate(v.d).replace(/\/\d+$/,"")}</text>`;});
  $("chart").innerHTML=s+"</svg>";
}

/* ---------- export ---------- */
async function save(filename,data){
  if(!downloads){alertBar("ดาวน์โหลดไฟล์ไม่ได้ ลองเปิดด้วย Safari แล้วลองอีกครั้ง");return;}
  try{await downloads.save({filename,data})}catch(e){if(e&&e.code!=="declined")alertBar("ส่งออกไม่สำเร็จ ลองอีกครั้ง")}
}
function alertBar(t){$("dbStatus").className="status err";$("dbStatus").textContent=t}
const idRows=()=>[...ids].sort((a,b)=>a.buyDate.localeCompare(b.buyDate)).map(x=>({"เกม":x.game,"รายละเอียด":x.detail,"วันที่รับซื้อ":x.buyDate,"ซื้อจาก":x.seller||"","ทุน":x.cost,"สถานะ":x.status==="sold"?"ขายแล้ว":"ในสต็อก","วันที่ขาย":x.saleDate||"","ขายให้":x.buyer||"","รับเงิน":x.method?METHOD[x.method]:"","ราคาขาย":x.status==="sold"?x.price:"","กำไร":x.status==="sold"?x.price-x.cost:""}));
const costRows=()=>[...costs].sort((a,b)=>a.date.localeCompare(b.date)).map(c=>({"วันที่":c.date,"ประเภท":TYPES[c.kind],"รายการ":c.item,"จำนวนเงิน":c.amount}));
function dailyRows(){const by={};const g=d=>by[d]=by[d]||{"วันที่":d,"ยอดขาย":0,"ทุนไอดีที่ขาย":0,"รับซื้อเข้าสต็อก":0,"ค่ายศเพจ":0,"รายจ่ายอื่น":0,"กำไรสุทธิ":0};
  ids.forEach(x=>{g(x.buyDate)["รับซื้อเข้าสต็อก"]+=x.cost;if(x.status==="sold"){const r=g(x.saleDate);r["ยอดขาย"]+=x.price;r["ทุนไอดีที่ขาย"]+=x.cost}});
  costs.forEach(c=>g(c.date)[c.kind==="pagefee"?"ค่ายศเพจ":"รายจ่ายอื่น"]+=c.amount);
  return Object.values(by).sort((a,b)=>a["วันที่"].localeCompare(b["วันที่"])).map(r=>(r["กำไรสุทธิ"]=r["ยอดขาย"]-r["ทุนไอดีที่ขาย"]-r["ค่ายศเพจ"]-r["รายจ่ายอื่น"],r));}
$("xlsxBtn").onclick=()=>{
  if(!window.XLSX){alertBar("โหลดตัวสร้างไฟล์ Excel ไม่ได้ ใช้ปุ่มส่งออก CSV แทน");return;}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(idRows()),"ไอดี");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(costRows()),"ค่ายศเพจและรายจ่าย");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dailyRows()),"สรุปรายวัน");
  save(`ขายไอดี-${today()}.xlsx`,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]));
};
$("csvBtn").onclick=()=>{const rows=idRows();if(!rows.length){alertBar("ยังไม่มีรายการให้ส่งออก");return;}
  const h=Object.keys(rows[0]);save(`ขายไอดี-${today()}.csv`,"﻿"+[h.join(","),...rows.map(r=>h.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(","))].join("\n"));};

/* ---------- boot ---------- */
const dl=document.createElement("datalist");dl.id="gameList";dl.innerHTML=GAMES.map(([n])=>`<option value="${n}">`).join("");document.body.append(dl);
render();
(async()=>{
  const C=window.claude;
  if(!C||!C.use){$("dbStatus").textContent="เบราว์เซอร์นี้เก็บข้อมูลไม่ได้ ลองเปิดด้วย Safari หรือ Chrome";return;}
  C.use("sample").then(s=>sample=s); C.use("assets").then(a=>{assetsApi=a;render()}); C.use("downloads").then(d=>downloads=d);
  const db=await C.use("db");
  if(!db){$("dbStatus").textContent="เบราว์เซอร์นี้เก็บข้อมูลไม่ได้ ปิดโหมดส่วนตัวแล้วลองใหม่";return;}
  col=db.collection("ids"); costCol=db.collection("costs");
  let got=0; const timer=setTimeout(()=>{$("dbStatus").textContent="กำลังเปิดข้อมูลในเครื่อง…"},10000);
  const done=snap=>{if(!snap.metadata.fromCache&&++got>=2){clearTimeout(timer);$("dbStatus").className="status";$("dbStatus").textContent=""}};
  col.onSnapshot(snap=>{done(snap);ids=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.buyDate);render()},()=>{clearTimeout(timer);alertBar("โหลดข้อมูลไม่ได้ ปิดแล้วเปิดหน้านี้ใหม่")});
  costCol.onSnapshot(snap=>{done(snap);costs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.date&&TYPES[c.kind]);render()},()=>{clearTimeout(timer);alertBar("โหลดข้อมูลไม่ได้ ปิดแล้วเปิดหน้านี้ใหม่")});
})();
</script>
